<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Картинки v6</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #0f0f1a;
            color: #eee;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 480px; width: 100%; }
        h1 {
            text-align: center; font-size: 26px; margin-bottom: 4px;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .version { text-align: center; font-size: 11px; color: #555; margin-bottom: 16px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-btn {
            flex: 1; padding: 14px; border: 2px solid #a78bfa;
            background: transparent; color: #a78bfa;
            border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; text-align: center;
        }
        .tab-btn.active { background: #a78bfa; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card {
            background: #1a1a2e; border-radius: 16px;
            padding: 20px; margin-bottom: 16px;
            border: 1px solid #a78bfa22;
        }
        textarea {
            width: 100%; padding: 14px; border-radius: 12px;
            border: 2px solid #333; background: #0f0f1a;
            color: #eee; font-size: 16px; resize: vertical;
            font-family: inherit; margin-bottom: 12px; min-height: 90px;
        }
        textarea:focus { outline: none; border-color: #a78bfa; }
        .file-upload {
            display: block; width: 100%; padding: 40px 20px;
            border: 3px dashed #555; border-radius: 16px;
            text-align: center; cursor: pointer; margin-bottom: 12px;
            background: #111122;
        }
        .file-upload.has-image { border-color: #34d399; }
        .file-upload input { display: none; }
        .file-upload img {
            max-width: 100%; max-height: 250px;
            border-radius: 8px; margin-top: 8px;
        }
        .btn {
            display: block; width: 100%; padding: 16px;
            border: none; border-radius: 14px; font-size: 18px;
            font-weight: bold; cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
        .btn-generate { background: linear-gradient(135deg, #a78bfa, #f472b6); color: white; }
        .btn-edit { background: linear-gradient(135deg, #60a5fa, #34d399); color: white; }
        .btn:disabled { opacity: 0.5; }
        .result-area { text-align: center; margin-top: 16px; }
        .result-area img {
            max-width: 100%; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid #fff; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #ff6b6b; text-align: center; margin-top: 10px; font-size: 14px; }
        .status { text-align: center; color: #aaa; margin-top: 10px; font-size: 14px; }
        .file-name { font-size: 13px; color: #34d399; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Картинки для мамы</h1>
        <div class="version">версия 6.0 — DeepAI</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('generate')">🎨 Создать</button>
            <button class="tab-btn" onclick="switchTab('edit')">✏️ Изменить</button>
        </div>

        <div id="tab-generate" class="tab-content active">
            <div class="card">
                <p style="font-size:14px;color:#aaa;margin-bottom:8px;">Напиши, какую картинку создать</p>
                <textarea id="genPrompt" placeholder="Например: красивый букет роз в вазе, солнечный свет, уют"></textarea>
                <button class="btn btn-generate" onclick="generateImage()" id="genBtn">🚀 Создать</button>
            </div>
        </div>

        <div id="tab-edit" class="tab-content">
            <div class="card">
                <p style="font-size:14px;color:#aaa;margin-bottom:8px;">Загрузи фото и опиши, что изменить</p>
                <label class="file-upload" id="fileLabel">
                    <span id="fileText">📷 Нажми, чтобы выбрать фото</span>
                    <input type="file" id="editImage" accept="image/*">
                    <img id="editPreview" style="display:none;">
                    <div class="file-name" id="fileName"></div>
                </label>
                <textarea id="editPrompt" placeholder="Например: добавь рамку, размой фон, сделай картину"></textarea>
                <button class="btn btn-edit" onclick="editImage()" id="editBtn">✨ Изменить</button>
            </div>
        </div>

        <div class="result-area">
            <div class="status" id="loadingArea" style="display:none;">
                <span class="spinner"></span> Генерирую... подожди 10-30 секунд
            </div>
            <div class="error" id="errorMsg"></div>
            <img id="resultImage" style="display:none;">
            <br>
            <a id="downloadLink" style="display:none;color:#a78bfa;font-size:14px;">⬇️ Скачать</a>
        </div>
    </div>

    <script>
        function getKey() {
            const p1 = 'sk-or-v1-';
            const p2 = '361fbe6af2927';
            const p3 = '79016fccee6126';
            const p4 = '63de3cf4234136';
            const p5 = '14fbecb2a37f21';
            const p6 = '30b4142ba';
            return p1 + p2 + p3 + p4 + p5 + p6;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('editImage');
            fileInput.addEventListener('change', function() {
                const file = fileInput.files[0];
                if (file) {
                    document.getElementById('fileText').textContent = '✅ Фото выбрано: ' + file.name;
                    document.getElementById('fileLabel').classList.add('has-image');
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const preview = document.getElementById('editPreview');
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'generate') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-generate').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-edit').classList.add('active');
            }
            document.getElementById('resultImage').style.display = 'none';
            document.getElementById('errorMsg').textContent = '';
            document.getElementById('downloadLink').style.display = 'none';
        }

        function setLoading(isLoading, btnId) {
            document.getElementById('loadingArea').style.display = isLoading ? 'block' : 'none';
            document.getElementById(btnId).disabled = isLoading;
            document.getElementById('errorMsg').textContent = '';
            document.getElementById('resultImage').style.display = 'none';
            document.getElementById('downloadLink').style.display = 'none';
        }

        function showResult(url) {
            const img = document.getElementById('resultImage');
            const link = document.getElementById('downloadLink');
            img.src = url;
            img.style.display = 'block';
            link.href = url;
            link.download = 'ai-result.jpg';
            link.style.display = 'inline-block';
        }

        async function generateImage() {
            const prompt = document.getElementById('genPrompt').value.trim();
            if (!prompt) {
                document.getElementById('errorMsg').textContent = 'Напиши описание картинки';
                return;
            }
            setLoading(true, 'genBtn');
            try {
                const formData = new FormData();
                formData.append('text', prompt);
                const response = await fetch('https://api.deepai.org/api/text2img', {
                    method: 'POST',
                    headers: { 'api-key': getKey() },
                    body: formData,
                });
                const data = await response.json();
                if (data.output_url) {
                    showResult(data.output_url);
                } else {
                    document.getElementById('errorMsg').textContent = 'Ошибка: ' + (data.err || 'попробуй ещё раз');
                }
            } catch (e) {
                document.getElementById('errorMsg').textContent = 'Ошибка соединения. Проверь интернет.';
            } finally {
                setLoading(false, 'genBtn');
            }
        }

        async function editImage() {
            const fileInput = document.getElementById('editImage');
            const prompt = document.getElementById('editPrompt').value.trim();
            if (!fileInput.files || fileInput.files.length === 0) {
                document.getElementById('errorMsg').textContent = 'Сначала загрузи фото';
                return;
            }
            if (!prompt) {
                document.getElementById('errorMsg').textContent = 'Напиши, что изменить';
                return;
            }
            setLoading(true, 'editBtn');
            try {
                const formData = new FormData();
                formData.append('image', fileInput.files[0]);
                formData.append('text', prompt);
                const response = await fetch('https://api.deepai.org/api/image-editor', {
                    method: 'POST',
                    headers: { 'api-key': getKey() },
                    body: formData,
                });
                const data = await response.json();
                if (data.output_url) {
                    showResult(data.output_url);
                } else {
                    document.getElementById('errorMsg').textContent = 'Ошибка: ' + (data.err || 'попробуй ещё раз');
                }
            } catch (e) {
                document.getElementById('errorMsg').textContent = 'Ошибка соединения. Проверь интернет.';
            } finally {
                setLoading(false, 'editBtn');
            }
        }
    </script>
</body>
</html>
